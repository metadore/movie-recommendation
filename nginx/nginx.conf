upstream cinepulse_backend {
    # Passive health-check: after 1 failure within 10 s, mark the upstream
    # as temporarily unavailable for 10 s.  This prevents failed requests
    # when one instance is stopped mid-test.
    server backend1:8000 max_fails=1 fail_timeout=10s;
    server backend2:8000 max_fails=1 fail_timeout=10s;
    server backend3:8000 max_fails=1 fail_timeout=10s;
}

server {
    listen 80;
    server_name localhost;

    # Retry the next upstream on connect / read errors
    proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
    proxy_next_upstream_tries 3;

    location /api/ {
        proxy_pass         http://cinepulse_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        add_header         X-Upstream-Addr   $upstream_addr always;
        add_header         X-Upstream-Status $upstream_status always;
    }

    location ~ ^/(movies|recommend|gemini|docs|openapi) {
        proxy_pass         http://cinepulse_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        add_header         X-Upstream-Addr   $upstream_addr always;
    }

    location /nginx-health {
        return 200 "nginx ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass         http://cinepulse_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        add_header         X-Upstream-Addr   $upstream_addr always;
    }
}
