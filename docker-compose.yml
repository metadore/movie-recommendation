version: "3.9"

# ────────────────────────────────────────────────────────────────────────────
# CinePulse – scalable stack
#   nginx (port 80)  →  backend1 / backend2 / backend3 (port 8000 each)
#   All three backends share the same SQLite file via a named volume.
#   To use PostgreSQL/MySQL instead, set DATABASE_URL in .env.
# ────────────────────────────────────────────────────────────────────────────

x-backend-common: &backend-common
  build:
    context: ./movie-recommendation-app-main
    dockerfile: Dockerfile
  environment:
    - DATABASE_URL=${DATABASE_URL:-sqlite:////data/movies.db}
    - JWT_SECRET=${JWT_SECRET:-cinepulse-dev-secret-change-me-32b+}
    - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    - TMDB_API_KEY=${TMDB_API_KEY:-}
  volumes:
    - db_data:/data
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 10s

services:
  # ── Backend instances ────────────────────────────────────────────────────
  backend1:
    <<: *backend-common
    container_name: cinepulse_backend1
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////data/movies.db}
      - JWT_SECRET=${JWT_SECRET:-cinepulse-dev-secret-change-me-32b+}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - INSTANCE_ID=backend1

  backend2:
    <<: *backend-common
    container_name: cinepulse_backend2
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////data/movies.db}
      - JWT_SECRET=${JWT_SECRET:-cinepulse-dev-secret-change-me-32b+}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - INSTANCE_ID=backend2

  backend3:
    <<: *backend-common
    container_name: cinepulse_backend3
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////data/movies.db}
      - JWT_SECRET=${JWT_SECRET:-cinepulse-dev-secret-change-me-32b+}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - INSTANCE_ID=backend3

  # ── Nginx load balancer ──────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: cinepulse_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
    restart: unless-stopped

volumes:
  db_data:
    driver: local
